[VR]
RootCellarBedFallback=1
; PF16B retains the exact renderer-level maximum-distance and scene-octree patch.
; The older UObject-table scanner took roughly 95 seconds to finish in the
; reported PF15 session and did not prevent the remaining parent-node culling.
; Keep it available as a diagnostic fallback, but off by default to avoid the
; several-minute startup hitch. Set to 1 and restart only for comparison.
PrimitiveDrawDistanceFix=0
; Fail visible for completed gameplay occlusion queries. This avoids one-frame-old
; CPU-view decisions hiding objects after the VR head view has moved.
HardwareOcclusionFix=1
; CP1 default: declare Outlast's unchanged display-ready gameplay bytes as
; sRGB to the OpenXR compositor. Set to 0 and restart for PF10 legacy UNORM.
GameplaySrgb=1
