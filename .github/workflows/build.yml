name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel 3

      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      - name: Upload mod and launcher build
        uses: actions/upload-artifact@v4
        with:
          name: Outlast2VR-Windows-x64-${{ github.sha }}
          path: |
            build/bin/**/dinput8.dll
            build/bin/**/Outlast2VR.exe
          if-no-files-found: error
          retention-days: 14
