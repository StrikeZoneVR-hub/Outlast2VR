[VR]
UnitsPerMeter=100
PitchLock=1
HmdWalking=1
HmdYawSign=1
ReflectionCamera=0

; Beta 1.1 defaults to the proven sharp compatibility renderer. It performs
; one exact gameplay copy, avoids the experimental depth shader overhead and
; works across more OpenXR/GPU combinations. Mode 2 remains available as an
; opt-in true-depth experiment. UI/menu/loading presentation is unchanged.
; 0=legacy alternating eyes, 1=sharp compatibility (recommended), 2=experimental depth stereo.
SameFrameStereo=1

; MC1 hybrid foundation: Quest/Touch buttons, sticks, haptics, and grip poses are
; enabled. Physical Xbox/XInput pads continue to work and are merged safely.
; MC6F: Quest controllers drive only the validated native arm chains. The game
; retains the torso, head, camera, hips and legs; native finger poses travel with
; the tracked wrists instead of being replaced by custom finger animation.
; PB5: Quest X is the only VR Use/interact control. A fresh left-grip squeeze
; calls Outlast's native bandage action; a fresh right-grip squeeze sends one
; native camcorder press. The game remains in
; charge of interaction targeting, hand animations, camera HUD/NV and batteries.
; The previous left-grip reach interaction remains disabled. Native FastTrace,
; when its exact runtime signature is verified, limits the HMD and tracked hands
; at nearby walls. A conservative torso capsule keeps wrists out of the body.
; Camcorder zoom now preserves the game's relative zoom inside the headset FOV.
; MC6F: right grip sends one native camcorder raise/lower press per squeeze.
; Right-stick click toggles night vision and right-stick up/down uses native zoom.
; There is no held-away/proximity state, tracked camcorder model or hand-to-hand
; separation. Wrist targets stop outside a protected headset volume, and native
; interaction/camcorder animations temporarily override tracked arm poses.
; Hand wall traces are disabled because the native trace can hit the player's own
; body and freeze both wrist targets. Headset-to-wall protection remains active.
BodyIK=1
PhysicalCamcorder=0
PhysicalInteractions=0
BodyCollision=1
BodyYaw=1
RightHandNeutral=1
RoomscaleBody=0
VrInput=1
TrackedControllerPoses=1
; MC6F body anchor: keep the camera within 10 cm horizontally and 18 cm
; vertically of the native character while retaining live orientation and
; positional 6DoF inside that natural neck-sized zone. The same correction is
; applied to tracked hands. This is active during gameplay, scripted scenes and
; camcorder use. Native capsule movement remains disabled to protect triggers.
LockHeadTranslation=1
HeadBodyFollow=0

; P36 minimal cleanup: native camera is left completely alone.
CamcorderHolster=0
HideCamcorderModel=0
CameraButton=0
NativeScreenHUD=0

; P46 frontend: world-anchored screen, width 2.4m at 2.2m distance.
; Rendered using a projection layer. F8 recenters it. No legacy MenuScale quad.

; PB1: the duplicate full camcorder overlay is suppressed during camera use.
; Only a compact battery meter is submitted in view space; the game's camera,
; recordings, battery drain, night vision and zoom systems remain native.
HudScale=0.42
HudDistance=1.85
; P45: copy one completed eye to the desktop mirror after XR submission.
DesktopSingleEye=1
CamcorderTargetProbe=0
NativeLensCapture=0
LensHudStraightAlpha=0

Runtime=OpenXR
